name: Update GitHub Profile Metrics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  generate-profile-cards:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Required so the action can commit generated files
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate profile analytics
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: 4ymaneBH
          BRANCH_NAME: main
          UTC_OFFSET: 1
          AUTO_PUSH: true
          THEME: tokyonight
          ANIMATION: load
          DURATION: 2
          NAME: Aymane Bouhou