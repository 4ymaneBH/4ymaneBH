name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"   # Runs daily at 03:00 UTC to avoid peak scheduling hours
  workflow_dispatch:        # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F97316&color_dots=#EBEDF0,#BFDBFE,#60A5FA,#FBBF24,#F97316
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F97316&color_dots=#161B22,#1E3A8A,#2563EB,#F59E0B,#F97316

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
